<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Candy Crush</title>
<style>
:root{--bg1:#ffd6ec;--bg2:#c9b6ff;--card:#ffffffcc;--ink:#3a1f5c;--bar:#ff4d9d;--board:#ffffff80;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1040;--bg2:#12093a;--card:#ffffff1a;--ink:#fbeaff;--board:#ffffff14}}
:root[data-theme="dark"]{--bg1:#2a1040;--bg2:#12093a;--card:#ffffff1a;--ink:#fbeaff;--board:#ffffff14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));user-select:none;-webkit-user-select:none;padding:12px}
h1{margin:0;font-size:clamp(28px,7vw,44px);letter-spacing:1px;background:linear-gradient(90deg,#ff4d6d,#ff9f1c,#ffd60a,#4cc94c,#4895ef,#9b5de5);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #0002)}
.hud{display:flex;gap:8px;width:min(94vw,520px)}
.box{flex:1;background:var(--card);border-radius:14px;padding:6px 10px;text-align:center;backdrop-filter:blur(6px)}
.box small{display:block;font-size:12px;opacity:.7}.box b{font-size:22px}
.bar{width:min(94vw,520px);height:14px;border-radius:9px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9f1c,var(--bar));transition:width .4s}
.wrap{position:relative;width:min(94vw,62vh,520px)}
#board{position:relative;width:100%;aspect-ratio:1;background:var(--board);border-radius:18px;overflow:hidden;touch-action:none;box-shadow:0 8px 30px #0003}
.tile{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .25s ease-in}
.g{position:absolute;inset:9%;transition:transform .2s,opacity .25s}
.g::before{content:"";position:absolute;left:18%;top:12%;width:38%;height:24%;border-radius:50%;background:#fff;opacity:.55;transform:rotate(-30deg);z-index:2}
.g.pop{transform:scale(0) rotate(90deg);opacity:0}
.sel .g{animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.18)}}
.t0{background:radial-gradient(circle at 35% 30%,#ff9aa9,#e5173f 72%);border-radius:50%}
.t1{background:radial-gradient(circle at 35% 30%,#ffd08a,#f57c00 72%);border-radius:28%}
.t2{background:radial-gradient(circle at 35% 30%,#fff7a0,#f2c200 72%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.t3{background:radial-gradient(circle at 35% 30%,#a6f5a0,#1fa83a 72%);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.t4{background:radial-gradient(circle at 35% 30%,#a8d4ff,#1f6fe0 72%);clip-path:polygon(50% 4%,98% 92%,2% 92%);border-radius:0}
.t5{background:radial-gradient(circle at 35% 30%,#e0b8ff,#7a2fd6 72%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%}
.h::after,.v::after{content:"";position:absolute;inset:0;z-index:1}
.h::after{background:repeating-linear-gradient(0deg,#ffffffcc 0 4px,transparent 4px 11px)}
.v::after{background:repeating-linear-gradient(90deg,#ffffffcc 0 4px,transparent 4px 11px)}
.bomb{background:conic-gradient(#ff4d6d,#ffd60a,#4cc94c,#4895ef,#9b5de5,#ff4d6d);border-radius:50%;animation:spin 3s linear infinite}
.bomb::after{content:"";position:absolute;inset:28%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#666,#111)}
@keyframes spin{to{filter:hue-rotate(360deg)}}
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000a;border-radius:18px;color:#fff;text-align:center;z-index:5}
#ov h2{margin:0;font-size:32px}
button{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:24px;padding:10px 28px;color:#fff;background:linear-gradient(180deg,#ff7ab8,#ff3d8b);box-shadow:0 4px 0 #b3175f;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b3175f}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#000b;color:#fff;padding:4px 14px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .3s;z-index:6;pointer-events:none}
</style>
</head>
<body>
<h1>Candy Crush</h1>
<div class="hud">
<div class="box"><small>Daraja</small><b id="lv">1</b></div>
<div class="box"><small>Ball</small><b id="sc">0</b></div>
<div class="box"><small>Maqsad</small><b id="gl">0</b></div>
<div class="box"><small>Yurish</small><b id="mv">0</b></div>
</div>
<div class="bar"><i id="pb"></i></div>
<div class="wrap">
<div id="board"></div>
<div id="toast"></div>
<div id="ov"><h2 id="ot"></h2><div id="om"></div><button id="ob">OK</button></div>
</div>
<script>
const N=8,T=6;
const board=document.getElementById('board'),ov=document.getElementById('ov');
let grid=[],score=0,moves=0,level=1,goal=0,busy=true,sel=null,drag=null;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);

function setPos(t){t.el.style.transform='translate('+t.c*100+'%,'+t.r*100+'%)';}
function mk(r,c,type,startR){
  const el=document.createElement('div');el.className='tile';
  const g=document.createElement('div');g.className='g t'+type;el.appendChild(g);
  board.appendChild(el);
  const tile={t:type,s:0,r:startR,c:c,el:el,g:g};
  setPos(tile);tile.r=r;
  if(startR!==r){void el.offsetWidth;setPos(tile);}
  return tile;
}
function setSpecial(t,s){
  t.s=s;
  if(s===3){t.t=-1;t.g.className='g bomb';}
  else{t.g.classList.remove('h','v');t.g.classList.add(s===1?'h':'v');}
}
function hud(){
  $('lv').textContent=level;$('sc').textContent=score;$('gl').textContent=goal;$('mv').textContent=moves;
  $('pb').style.width=Math.min(100,score/goal*100)+'%';
}
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1400);}

function getRuns(){
  const runs=[];
  for(let r=0;r<N;r++){
    let c=0;
    while(c<N){
      const t=grid[r][c].t;let e=c;
      while(e+1<N&&t>=0&&grid[r][e+1].t===t)e++;
      if(t>=0&&e-c>=2){const cells=[];for(let k=c;k<=e;k++)cells.push(grid[r][k]);runs.push({cells:cells,h:true});}
      c=e+1;
    }
  }
  for(let c=0;c<N;c++){
    let r=0;
    while(r<N){
      const t=grid[r][c].t;let e=r;
      while(e+1<N&&t>=0&&grid[e+1][c].t===t)e++;
      if(t>=0&&e-r>=2){const cells=[];for(let k=r;k<=e;k++)cells.push(grid[k][c]);runs.push({cells:cells,h:false});}
      r=e+1;
    }
  }
  return runs;
}
function hasMoves(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(grid[r][c].s===3)return true;
    for(const d of [[0,1],[1,0]]){
      const r2=r+d[0],c2=c+d[1];
      if(r2>=N||c2>=N)continue;
      const a=grid[r][c],b=grid[r2][c2];
      grid[r][c]=b;grid[r2][c2]=a;
      const ok=getRuns().length>0;
      grid[r][c]=a;grid[r2][c2]=b;
      if(ok)return true;
    }
  }
  return false;
}
function expand(set){
  const q=[...set];
  while(q.length){
    const t=q.pop(),add=[];
    if(t.s===1)for(let c=0;c<N;c++)add.push(grid[t.r][c]);
    if(t.s===2)for(let r=0;r<N;r++)add.push(grid[r][t.c]);
    for(const x of add)if(x&&!set.has(x)){set.add(x);q.push(x);}
  }
}
function gravity(){
  for(let c=0;c<N;c++){
    let w=N-1;
    for(let r=N-1;r>=0;r--){
      const t=grid[r][c];
      if(t){
        if(w!==r){grid[w][c]=t;grid[r][c]=null;t.r=w;setPos(t);}
        w--;
      }
    }
    const cnt=w+1;
    for(let r=w;r>=0;r--)grid[r][c]=mk(r,c,rnd(T),r-cnt-1);
  }
}
async function burst(clear,creates,combo){
  expand(clear);
  for(const cr of creates)clear.delete(cr.p);
  score+=clear.size*10*combo;
  for(const t of clear){grid[t.r][t.c]=null;t.g.classList.add('pop');}
  for(const cr of creates)setSpecial(cr.p,cr.s);
  hud();
  await sleep(260);
  clear.forEach(t=>t.el.remove());
  gravity();
  await sleep(380);
}
async function resolve(sw){
  let combo=0;
  while(true){
    const runs=getRuns();
    if(!runs.length)break;
    combo++;
    const clear=new Set(),cm=new Map();
    for(const run of runs){
      run.cells.forEach(x=>clear.add(x));
      if(run.cells.length>=4){
        const p=(sw&&run.cells.find(x=>sw.includes(x)))||run.cells[run.cells.length>>1];
        const s=run.cells.length>=5?3:(run.h?2:1);
        if(!cm.has(p)||cm.get(p).s<s)cm.set(p,{p:p,s:s});
      }
    }
    sw=null;
    await burst(clear,[...cm.values()],combo);
  }
}
async function useBomb(a,b){
  const set=new Set();
  const bombs=[a,b].filter(x=>x.s===3);
  const other=[a,b].find(x=>x.s!==3);
  if(!other){for(let r=0;r<N;r++)for(let c=0;c<N;c++)set.add(grid[r][c]);}
  else{
    set.add(bombs[0]);
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c].t===other.t)set.add(grid[r][c]);
  }
  await burst(set,[],2);
}
function swapT(a,b){
  grid[a.r][a.c]=b;grid[b.r][b.c]=a;
  const r=a.r,c=a.c;a.r=b.r;a.c=b.c;b.r=r;b.c=c;
  setPos(a);setPos(b);
}
async function shuffle(){
  toast('Aralashtirilmoqda...');
  const all=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)all.push(grid[r][c]);
  for(let tries=0;tries<200;tries++){
    for(let i=all.length-1;i>0;i--){const j=rnd(i+1);[all[i],all[j]]=[all[j],all[i]];}
    for(let i=0;i<all.length;i++)grid[i>>3][i&7]=all[i];
    if(!getRuns().length&&hasMoves())break;
  }
  for(let i=0;i<all.length;i++){all[i].r=i>>3;all[i].c=i&7;setPos(all[i]);}
  await sleep(400);
}
async function trySwap(a,b){
  busy=true;
  swapT(a,b);
  await sleep(250);
  if(a.s===3||b.s===3){
    moves--;hud();
    await useBomb(a,b);
    await resolve(null);
  }else if(getRuns().length){
    moves--;hud();
    await resolve([a,b]);
  }else{
    swapT(a,b);
    await sleep(250);
    busy=false;
    return;
  }
  await after();
}
function showOv(title,msg,btn,fn){
  $('ot').textContent=title;$('om').textContent=msg;$('ob').textContent=btn;
  $('ob').onclick=()=>{ov.style.display='none';fn();};
  ov.style.display='flex';
}
async function after(){
  if(score>=goal){
    showOv('Tabriklaymiz! 🎉','Ball: '+score,'Keyingi daraja',()=>{level++;startLevel();});
    return;
  }
  if(moves<=0){
    showOv('Yurishlar tugadi 😢','Ball: '+score+' / '+goal,'Qayta o\'ynash',()=>{startLevel();});
    return;
  }
  if(!hasMoves())await shuffle();
  busy=false;
}
function startLevel(){
  busy=true;sel=null;drag=null;
  board.innerHTML='';
  score=0;moves=Math.max(15,26-Math.floor(level/2));goal=700+level*600;
  let types;
  do{
    types=[];
    for(let r=0;r<N;r++){
      types.push([]);
      for(let c=0;c<N;c++){
        let t;
        do{t=rnd(T);}
        while((c>=2&&types[r][c-1]===t&&types[r][c-2]===t)||(r>=2&&types[r-1][c]===t&&types[r-2][c]===t));
        types[r].push(t);
      }
    }
    grid=types.map(row=>row.map(t=>({t:t,s:0})));
  }while(!hasMoves());
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)grid[r][c]=mk(r,c,types[r][c],r-N);
  hud();
  setTimeout(()=>{busy=false;},600);
}

function cellAt(e){
  const b=board.getBoundingClientRect();
  const c=Math.floor((e.clientX-b.left)/b.width*N),r=Math.floor((e.clientY-b.top)/b.height*N);
  return(r>=0&&r<N&&c>=0&&c<N)?grid[r][c]:null;
}
function clearSel(){if(sel){sel.el.classList.remove('sel');sel=null;}}
const adj=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;
board.addEventListener('pointerdown',e=>{
  if(busy)return;
  const t=cellAt(e);if(!t)return;
  if(sel&&sel!==t&&adj(sel,t)){const s=sel;clearSel();drag=null;trySwap(s,t);return;}
[04.10.2026 18:32] .: drag={t:t,x:e.clientX,y:e.clientY,done:false};
});
board.addEventListener('pointermove',e=>{
  if(!dragdrag.donebusy)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  const th=board.getBoundingClientRect().width/N*0.3;
  if(Math.max(Math.abs(dx),Math.abs(dy))<th)return;
  drag.done=true;
  let dr=0,dc=0;
  if(Math.abs(dx)>Math.abs(dy))dc=dx>0?1:-1;else dr=dy>0?1:-1;
  const r=drag.t.r+dr,c=drag.t.c+dc;
  const nb=(r>=0&&r<N&&c>=0&&c<N)?grid[r][c]:null;
  const t=drag.t;
  clearSel();drag=null;
  if(nb)trySwap(t,nb);
});
function endDrag(){
  if(drag&&!drag.done&&!busy){
    const t=drag.t;
    if(sel===t)clearSel();
    else{clearSel();sel=t;t.el.classList.add('sel');}
  }
  drag=null;
}
board.addEventListener('pointerup',endDrag);
board.addEventListener('pointercancel',()=>{drag=null;});
board.addEventListener('contextmenu',e=>e.preventDefault());

startLevel();
</script>
</body>
</html>
